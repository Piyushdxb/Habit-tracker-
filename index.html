<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DailyGrowth">
  <title>Daily Growth - Habit Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.2);
      --primary: #3b82f6;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 30px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }
    .title-area h1 {
      font-size: 1.3rem;
      font-weight: 700;
    }
    .title-area p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .streak-badge {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .date-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 8px 12px;
    }
    .date-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
    }
    .date-display {
      font-size: 0.95rem;
      font-weight: 600;
    }
    .progress-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .progress-info h2 {
      font-size: 1.1rem;
      margin-bottom: 4px;
    }
    .progress-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .progress-circle {
      position: relative;
      width: 68px;
      height: 68px;
    }
    .progress-circle svg {
      transform: rotate(-90deg);
    }
    .circle-bg {
      fill: none;
      stroke: #334155;
      stroke-width: 6;
    }
    .circle-progress {
      fill: none;
      stroke: var(--accent);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 175.9;
      stroke-dashoffset: 175.9;
      transition: stroke-dashoffset 0.4s ease;
    }
    .percentage-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.85rem;
      font-weight: 700;
    }
    .habits-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .habit-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .habit-item.completed {
      border-color: rgba(16, 185, 129, 0.5);
      background: rgba(16, 185, 129, 0.08);
    }
    .checkbox {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      border: 2px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .habit-item.completed .checkbox {
      background: var(--accent);
      border-color: var(--accent);
    }
    .checkbox svg {
      display: none;
      fill: #fff;
    }
    .habit-item.completed .checkbox svg {
      display: block;
    }
    .habit-text {
      flex: 1;
    }
    .habit-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }
    .habit-item.completed .habit-title {
      color: #e2e8f0;
    }
    .habit-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .badge-time {
      font-size: 0.7rem;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .notes-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .notes-section label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .notes-section textarea {
      width: 100%;
      height: 70px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px;
      color: var(--text-main);
      font-size: 0.85rem;
      resize: none;
      outline: none;
    }
    .notes-section textarea:focus {
      border-color: var(--primary);
    }
    .action-buttons {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-secondary {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="title-area">
        <h1>Daily Growth Tracker</h1>
        <p>1-Hour Self Improvement Plan</p>
      </div>
      <div class="streak-badge" id="streakBadge">
        🔥 <span id="streakCount">0</span> Days
      </div>
    </header>

    <div class="date-nav">
      <button class="date-btn" onclick="changeDate(-1)">◀</button>
      <div class="date-display" id="dateDisplay">Today</div>
      <button class="date-btn" onclick="changeDate(1)">▶</button>
    </div>

    <div class="progress-card">
      <div class="progress-info">
        <h2>Daily Goal</h2>
        <p id="progressSubtext">0 of 4 habits completed (0 mins)</p>
      </div>
      <div class="progress-circle">
        <svg width="68" height="68">
          <circle class="circle-bg" cx="34" cy="34" r="28" />
          <circle class="circle-progress" id="progressRing" cx="34" cy="34" r="28" />
        </svg>
        <div class="percentage-text" id="progressPercent">0%</div>
      </div>
    </div>

    <div class="habits-list" id="habitsList"></div>

    <div class="notes-section">
      <label for="dailyNote">Daily Reflection & Key Takeaway</label>
      <textarea id="dailyNote" placeholder="Write one key insight or win from today..." oninput="saveNote()"></textarea>
    </div>

    <div class="action-buttons">
      <button class="btn" onclick="shareProgress()">
        📤 Share Progress
      </button>
      <button class="btn btn-secondary" onclick="exportData()">
        💾 Backup Data
      </button>
    </div>
  </div>

  <script>
    const HABITS_CONFIG = [
      { id: 'movement', title: 'Movement & Breathwork', sub: 'Mobility, stretching, or pranayama', time: '15 mins', minutes: 15 },
      { id: 'mindset', title: 'Mindset & Priorities', sub: 'Top 3 intentions & quiet reflection', time: '10 mins', minutes: 10 },
      { id: 'learning', title: 'Focused Learning & Reading', sub: 'Active reading or practical skill study', time: '25 mins', minutes: 25 },
      { id: 'reflection', title: 'Evening Review & Wind-down', sub: 'Review day & screen-free prep', time: '10 mins', minutes: 10 }
    ];

    let currentDate = new Date();
    const STORAGE_KEY = 'daily_growth_habit_tracker_v1';

    function getStorageData() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch (e) {
        return {};
      }
    }

    function saveStorageData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function formatDateKey(date) {
      return date.toISOString().split('T')[0];
    }

    function formatDisplayDate(date) {
      const today = new Date();
      if (formatDateKey(date) === formatDateKey(today)) return 'Today';
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);
      if (formatDateKey(date) === formatDateKey(yesterday)) return 'Yesterday';
      return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function calculateStreak() {
      const data = getStorageData();
      let streak = 0;
      let checkDate = new Date();

      const todayKey = formatDateKey(checkDate);
      const todayData = data[todayKey] || {};
      const todayComplete = HABITS_CONFIG.every(h => todayData[h.id]);

      if (!todayComplete) {
        checkDate.setDate(checkDate.getDate() - 1);
      }

      while (true) {
        const key = formatDateKey(checkDate);
        const dayData = data[key] || {};
        const isComplete = HABITS_CONFIG.every(h => dayData[h.id]);
        if (isComplete) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else {
          break;
        }
      }
      return streak;
    }

    function renderApp() {
      const dateKey = formatDateKey(currentDate);
      const data = getStorageData();
      const dayData = data[dateKey] || {};

      document.getElementById('dateDisplay').textContent = formatDisplayDate(currentDate);
      document.getElementById('streakCount').textContent = calculateStreak();

      const habitsList = document.getElementById('habitsList');
      habitsList.innerHTML = '';

      let completedCount = 0;
      let completedMinutes = 0;

      HABITS_CONFIG.forEach(habit => {
        const isDone = !!dayData[habit.id];
        if (isDone) {
          completedCount++;
          completedMinutes += habit.minutes;
        }

        const item = document.createElement('div');
        item.className = `habit-item ${isDone ? 'completed' : ''}`;
        item.onclick = () => toggleHabit(habit.id);
        item.innerHTML = `
          <div class="checkbox">
            <svg width="14" height="14" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          </div>
          <div class="habit-text">
            <div class="habit-title">${habit.title}</div>
            <div class="habit-sub">${habit.sub}</div>
          </div>
          <div class="badge-time">${habit.time}</div>
        `;
        habitsList.appendChild(item);
      });

      const total = HABITS_CONFIG.length;
      const percent = Math.round((completedCount / total) * 100);
      document.getElementById('progressPercent').textContent = `${percent}%`;
      document.getElementById('progressSubtext').textContent = `${completedCount} of ${total} habits completed (${completedMinutes} mins)`;

      const circumference = 2 * Math.PI * 28;
      const offset = circumference - (percent / 100) * circumference;
      document.getElementById('progressRing').style.strokeDashoffset = offset;

      document.getElementById('dailyNote').value = dayData.note || '';
    }

    function toggleHabit(habitId) {
      const dateKey = formatDateKey(currentDate);
      const data = getStorageData();
      if (!data[dateKey]) data[dateKey] = {};
      data[dateKey][habitId] = !data[dateKey][habitId];
      saveStorageData(data);
      renderApp();
    }

    function saveNote() {
      const dateKey = formatDateKey(currentDate);
      const data = getStorageData();
      if (!data[dateKey]) data[dateKey] = {};
      data[dateKey].note = document.getElementById('dailyNote').value;
      saveStorageData(data);
    }

    function changeDate(delta) {
      currentDate.setDate(currentDate.getDate() + delta);
      renderApp();
    }

    function shareProgress() {
      const dateKey = formatDateKey(currentDate);
      const data = getStorageData();
      const dayData = data[dateKey] || {};
      const completedCount = HABITS_CONFIG.filter(h => dayData[h.id]).length;
      const streak = calculateStreak();

      const text = `🌱 Daily Growth Update (${formatDisplayDate(currentDate)}):\n` +
        `• Habits Done: ${completedCount}/${HABITS_CONFIG.length} (60-min routine)\n` +
        `• Current Streak: ${streak} day(s) 🔥\n` +
        (dayData.note ? `• Takeaway: "${dayData.note}"\n` : '') +
        `Tracking my personal growth daily!`;

      if (navigator.share) {
        navigator.share({ title: 'My Daily Growth Update', text: text });
      } else {
        navigator.clipboard.writeText(text);
        alert('Progress copied to clipboard! You can paste and send it to your friends.');
      }
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(getStorageData(), null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `growth_tracker_backup_${formatDateKey(new Date())}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    renderApp();
  </script>
</body>
</html>
